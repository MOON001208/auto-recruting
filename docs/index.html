<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scout Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .filter-btn {
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            transform: scale(1.05);
        }

        .job-card {
            transition: all 0.3s ease;
        }

        .job-card.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
    <script defer>
        // 카테고리 키워드 매핑 (config.py와 동일)
        const CATEGORY_KEYWORDS = {
            "Data": [
                "Data Analyst", "Product Data Analyst", "Business Data Analyst",
                "Data Analytics Engineer", "Analytics Engineer", "Marketing Engineer",
                "MarTech", "CRM Data Analyst", "CDP", "Customer Data Analyst",
                "데이터 분석", "프로덕트 데이터 분석", "비즈니스 데이터 분석",
                "애널리틱스 엔지니어", "마케팅 엔지니어", "마테크",
                "CRM 데이터 분석", "고객 데이터 분석", "고객 데이터 플랫폼"
            ],
            "Accounting": ["회계", "재무", "세무", "결산"],
            "HR": ["인사", "hrm", "hrd", "총무", "채용"]
        };

        let allJobs = [];
        let currentCategory = 'all';
        let currentPlatform = 'all';
        let showOnlyDeadlineToday = false;
        let showOnlyDeadlineTomorrow = false;
        let showOnlyNew = false;

        // 플랫폼 목록 (site 필드 기준)
        const PLATFORMS = {
            'all': { name: '전체', icon: '🌐' },
            'JobKorea': { name: '잡코리아', icon: '🟦' },
            'Linkareer': { name: '링커리어', icon: '🟩' },
            'Incruit': { name: '인크루트', icon: '🟧' },
            'Saramin': { name: '사람인', icon: '🟥' },
            'Wanted': { name: '원티드', icon: '🟪' }
        };

        async function loadJobs() {
            loadScraperStatus();
            try {
                const response = await fetch('jobs.json');
                allJobs = await response.json();

                // URL 파라미터에서 카테고리 및 필터 확인
                const urlParams = new URLSearchParams(window.location.search);
                const categoryParam = urlParams.get('category');
                if (categoryParam) {
                    currentCategory = categoryParam.toLowerCase();
                }
                const filterParam = urlParams.get('filter');
                if (filterParam === 'deadline') {
                    showOnlyDeadlineToday = true;
                } else if (filterParam === 'tomorrow') {
                    showOnlyDeadlineTomorrow = true;
                } else if (filterParam === 'new') {
                    showOnlyNew = true;
                }

                const platformParam = urlParams.get('platform');
                if (platformParam) {
                    currentPlatform = platformParam;
                }

                renderJobs(allJobs);
                updateFilterButtons();
                updateStats();
            } catch (e) {
                console.error("Failed to load jobs", e);
                document.getElementById('job-list').innerHTML = `<p class="text-red-500">데이터를 불러오는데 실패했습니다: ${e}</p>`;
            }
        }

        async function loadScraperStatus() {
            try {
                const response = await fetch('scraper_status.json');
                if (!response.ok) return;
                const status = await response.json();
                const affected = Object.entries(status.sites || {})
                    .filter(([, value]) => value.status !== 'ok')
                    .map(([site]) => PLATFORMS[site]?.name || site);
                const notice = document.getElementById('scraper-status');
                if (affected.length && notice) {
                    notice.textContent = `최근 수집에서 확인이 필요한 사이트: ${affected.join(', ')}. 해당 사이트의 공고가 적거나 없을 수 있습니다.`;
                    notice.hidden = false;
                }
            } catch (e) {
                console.warn('수집 상태를 불러오지 못했습니다.', e);
            }
        }

        function getJobCategory(job) {
            // 새 공고는 서버에서 제목/JD로 검증한 분류를 그대로 사용한다.
            if (Object.hasOwn(CATEGORY_KEYWORDS, job.category)) {
                return job.category.toLowerCase();
            }
            const keyword = (job.hidden_keyword || '').toLowerCase();

            for (const [category, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
                if (keywords.some(kw => keyword === kw.toLowerCase())) {
                    return category.toLowerCase();
                }
            }
            return 'other';
        }

        function filterByCategory(category) {
            currentCategory = category;

            // URL 업데이트 (히스토리에 추가)
            const url = new URL(window.location);
            if (category === 'all') {
                url.searchParams.delete('category');
            } else {
                url.searchParams.set('category', category);
            }
            window.history.pushState({}, '', url);

            renderJobs(allJobs);
            updateFilterButtons();
            updateStats();
        }

        function toggleDeadlineFilter() {
            showOnlyDeadlineToday = !showOnlyDeadlineToday;
            if (showOnlyDeadlineToday) showOnlyNew = false; // 상호 배타적

            // URL 업데이트
            const url = new URL(window.location);
            if (showOnlyDeadlineToday) {
                url.searchParams.set('filter', 'deadline');
            } else {
                url.searchParams.delete('filter');
            }
            window.history.pushState({}, '', url);

            renderJobs(allJobs);
            updateFilterButtons();
            updateStats();
        }

        function toggleTomorrowFilter() {
            showOnlyDeadlineTomorrow = !showOnlyDeadlineTomorrow;
            if (showOnlyDeadlineTomorrow) {
                showOnlyDeadlineToday = false;
                showOnlyNew = false;
            }

            const url = new URL(window.location);
            if (showOnlyDeadlineTomorrow) {
                url.searchParams.set('filter', 'tomorrow');
            } else {
                url.searchParams.delete('filter');
            }
            window.history.pushState({}, '', url);

            renderJobs(allJobs);
            updateFilterButtons();
            updateStats();
        }

        function toggleNewFilter() {
            showOnlyNew = !showOnlyNew;
            if (showOnlyNew) {
                showOnlyDeadlineToday = false;
                showOnlyDeadlineTomorrow = false;
            }

            // URL 업데이트
            const url = new URL(window.location);
            if (showOnlyNew) {
                url.searchParams.set('filter', 'new');
            } else {
                url.searchParams.delete('filter');
            }
            window.history.pushState({}, '', url);

            renderJobs(allJobs);
            updateFilterButtons();
            updateStats();
        }

        function filterByPlatform(platform) {
            currentPlatform = platform;

            // URL 업데이트
            const url = new URL(window.location);
            if (platform === 'all') {
                url.searchParams.delete('platform');
            } else {
                url.searchParams.set('platform', platform);
            }
            window.history.pushState({}, '', url);

            renderJobs(allJobs);
            updateFilterButtons();
            updateStats();
        }

        function updateFilterButtons() {
            // 카테고리 버튼 업데이트
            document.querySelectorAll('.filter-btn[data-category]').forEach(btn => {
                const btnCategory = btn.dataset.category;
                if (btnCategory === currentCategory) {
                    btn.classList.add('active');
                    btn.classList.remove('bg-gray-200', 'text-gray-700');

                    // 카테고리별 색상 적용
                    if (btnCategory === 'all') {
                        btn.classList.add('bg-gradient-to-r', 'from-blue-600', 'to-purple-600', 'text-white');
                    } else if (btnCategory === 'data') {
                        btn.classList.add('bg-blue-600', 'text-white');
                    } else if (btnCategory === 'accounting') {
                        btn.classList.add('bg-green-600', 'text-white');
                    } else if (btnCategory === 'hr') {
                        btn.classList.add('bg-orange-600', 'text-white');
                    }
                } else {
                    btn.classList.remove('active', 'bg-gradient-to-r', 'from-blue-600', 'to-purple-600',
                        'bg-blue-600', 'bg-green-600', 'bg-orange-600', 'text-white');
                    btn.classList.add('bg-gray-200', 'text-gray-700');
                }
            });

            // 오늘 마감 버튼 업데이트
            const deadlineBtn = document.getElementById('btn-deadline');
            if (deadlineBtn) {
                if (showOnlyDeadlineToday) {
                    deadlineBtn.classList.add('active', 'bg-red-600', 'text-white');
                    deadlineBtn.classList.remove('bg-gray-200', 'text-gray-700');
                } else {
                    deadlineBtn.classList.remove('active', 'bg-red-600', 'text-white');
                    deadlineBtn.classList.add('bg-gray-200', 'text-gray-700');
                }
            }

            // 신규 버튼 업데이트
            const newBtn = document.getElementById('btn-new');
            if (newBtn) {
                if (showOnlyNew) {
                    newBtn.classList.add('active', 'bg-green-600', 'text-white');
                    newBtn.classList.remove('bg-gray-200', 'text-gray-700');
                } else {
                    newBtn.classList.remove('active', 'bg-green-600', 'text-white');
                    newBtn.classList.add('bg-gray-200', 'text-gray-700');
                }
            }

            // 내일 마감 버튼 업데이트
            const tomorrowBtn = document.getElementById('btn-tomorrow');
            if (tomorrowBtn) {
                if (showOnlyDeadlineTomorrow) {
                    tomorrowBtn.classList.add('active', 'bg-orange-500', 'text-white');
                    tomorrowBtn.classList.remove('bg-gray-200', 'text-gray-700');
                } else {
                    tomorrowBtn.classList.remove('active', 'bg-orange-500', 'text-white');
                    tomorrowBtn.classList.add('bg-gray-200', 'text-gray-700');
                }
            }

            // 플랫폼 버튼 업데이트
            document.querySelectorAll('.filter-btn[data-platform]').forEach(btn => {
                const btnPlatform = btn.dataset.platform;
                if (btnPlatform === currentPlatform) {
                    btn.classList.add('active', 'bg-indigo-600', 'text-white');
                    btn.classList.remove('bg-gray-200', 'text-gray-700');
                } else {
                    btn.classList.remove('active', 'bg-indigo-600', 'text-white');
                    btn.classList.add('bg-gray-200', 'text-gray-700');
                }
            });
        }

        function updateStats() {
            const filteredJobs = currentCategory === 'all'
                ? allJobs
                : allJobs.filter(job => getJobCategory(job) === currentCategory);

            const total = filteredJobs.length;
            const newCount = filteredJobs.filter(j => j.is_new).length;
            const deadlineCount = filteredJobs.filter(j => checkDeadline(j.deadline)).length;
            const tomorrowCount = filteredJobs.filter(j => checkDeadlineTomorrow(j.deadline)).length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-new').textContent = newCount;
            document.getElementById('stat-deadline').textContent = deadlineCount;

            const statTomorrow = document.getElementById('stat-tomorrow');
            if (statTomorrow) statTomorrow.textContent = tomorrowCount;
        }

        function renderJobs(jobs) {
            const list = document.getElementById('job-list');
            list.innerHTML = '';

            // 현재 카테고리로 필터링
            let filteredJobs = currentCategory === 'all'
                ? jobs
                : jobs.filter(job => getJobCategory(job) === currentCategory);

            // ⚠️ 마감된 공고(D < 0) 제외 - 상시채용/OPEN은 유지
            filteredJobs = filteredJobs.filter(job => {
                const days = getDaysUntilDeadline(job.deadline);
                // days가 null이면 (상시채용, OPEN 등) 유지
                // days가 0 이상이면 유지
                // days가 음수면 마감됨 → 제외
                return days === null || days >= 0;
            });

            // 오늘 마감 필터 적용
            if (showOnlyDeadlineToday) {
                filteredJobs = filteredJobs.filter(job => checkDeadline(job.deadline));
            }

            // 내일 마감 필터 적용
            if (showOnlyDeadlineTomorrow) {
                filteredJobs = filteredJobs.filter(job => checkDeadlineTomorrow(job.deadline));
            }

            // 플랫폼 필터 적용
            if (currentPlatform !== 'all') {
                filteredJobs = filteredJobs.filter(job => job.site === currentPlatform);
            }

            // 신규 필터 적용
            if (showOnlyNew) {
                filteredJobs = filteredJobs.filter(job => job.is_new);
            }

            // 데이터 탭은 JD에서 서로 다른 희망 역량이 많이 확인된 공고부터 표시.
            // 동점은 기존 마감일/최신순을 유지한다.
            if (currentCategory === 'data') {
                filteredJobs = [...filteredJobs].sort((a, b) =>
                    (b.data_relevance?.score || 0) - (a.data_relevance?.score || 0));
            }

            if (filteredJobs.length === 0) {
                list.innerHTML = `
                    <div class="text-center text-gray-500 py-10">
                        <p class="text-2xl mb-2">📭</p>
                        <p>해당 카테고리의 공고가 없습니다.</p>
                    </div>
                `;
                return;
            }

            filteredJobs.forEach(job => {
                const isDeadline = checkDeadline(job.deadline);        // D-0
                const isTomorrow = checkDeadlineTomorrow(job.deadline); // D-1
                const isNew = job.is_new;
                const jobCategory = getJobCategory(job);
                const daysLeft = formatDaysLeft(job.deadline);

                const card = document.createElement('div');
                // D-0은 빨간색, D-1은 주황색, 신규는 초록색
                let borderColor = 'border-gray-200';
                if (isDeadline) borderColor = 'border-red-500';
                else if (isTomorrow) borderColor = 'border-orange-500';
                else if (isNew) borderColor = 'border-green-500';

                card.className = `job-card bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition border-l-4 ${borderColor} animate-fadeIn`;
                card.dataset.category = jobCategory;

                let badges = '';
                // D-X 뱃지 표시
                if (isDeadline) {
                    badges += `<span class="bg-red-100 text-red-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">🚨 D-0 오늘마감</span>`;
                } else if (isTomorrow) {
                    badges += `<span class="bg-orange-100 text-orange-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">🔥 D-1 내일마감</span>`;
                } else if (daysLeft && daysLeft !== '마감됨') {
                    badges += `<span class="bg-yellow-100 text-yellow-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">⏰ ${daysLeft}</span>`;
                }
                if (isNew) badges += `<span class="bg-green-100 text-green-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">✨ 신규</span>`;

                // 카테고리 뱃지
                const categoryColors = {
                    'data': 'bg-blue-100 text-blue-800',
                    'accounting': 'bg-emerald-100 text-emerald-800',
                    'hr': 'bg-orange-100 text-orange-800',
                    'other': 'bg-gray-100 text-gray-800'
                };
                const categoryNames = {
                    'data': '데이터',
                    'accounting': '회계',
                    'hr': '인사',
                    'other': '기타'
                };
                badges += `<span class="${categoryColors[jobCategory]} text-xs font-semibold px-2.5 py-0.5 rounded">${categoryNames[jobCategory]}</span>`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            ${badges}
                            <h2 class="text-xl font-bold text-gray-900 mt-2">${job.title}</h2>
                            <p class="text-gray-600 font-medium">${job.company} | ${job.site}</p>
                            <p class="text-sm text-gray-400 mt-1">마감일: ${job.deadline}</p>
                        </div>
                        <a href="${job.link}" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm">공고 보기</a>
                    </div>
                `;
                list.appendChild(card);
                if (jobCategory === 'data') {
                    const relevance = job.data_relevance || {};
                    const jdInfo = document.createElement('p');
                    jdInfo.className = 'mt-3 text-sm text-blue-700';
                    const signals = relevance.matched_keywords || [];
                    jdInfo.textContent = relevance.jd_status === 'available'
                        ? `JD 키워드 ${signals.length}개 일치${signals.length ? ': ' + signals.join(' · ') : ''}`
                        : 'JD 확인 필요 · 직무명 기준으로 수집한 공고입니다.';
                    card.appendChild(jdInfo);
                }
            });
        }

        // 마감일 문자열을 파싱해서 Date 객체로 변환
        function parseDeadlineDate(deadlineStr) {
            if (!deadlineStr) return null;

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // 1. "오늘마감" 키워드 체크
            if (deadlineStr.includes('오늘') || deadlineStr.toLowerCase().includes('today')) {
                return today;
            }

            // 2. "내일마감" 키워드 체크
            if (deadlineStr.includes('내일') || deadlineStr.toLowerCase().includes('tomorrow')) {
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                return tomorrow;
            }

            // 3. D-숫자 형식 체크 (D-0, D-1, D-3 등)
            const dMinusMatch = deadlineStr.match(/D-(\d+)/i);
            if (dMinusMatch) {
                const daysLeft = parseInt(dMinusMatch[1]);
                const targetDate = new Date(today);
                targetDate.setDate(targetDate.getDate() + daysLeft);
                return targetDate;
            }

            // 4. 날짜 형식 파싱
            // 구분자 통일: / 와 - 를 . 으로 변환
            const normalized = deadlineStr.replace(/\//g, '.').replace(/-/g, '.');

            // 숫자와 점만 추출
            const cleanDate = normalized.replace(/[^\d.]/g, '');

            if (!cleanDate) return null;

            let year, month, day;
            const parts = cleanDate.split('.').filter(p => p.length > 0);

            if (parts.length >= 3 && parts[0].length === 4) {
                // YYYY.MM.DD
                year = parseInt(parts[0]);
                month = parseInt(parts[1]) - 1;
                day = parseInt(parts[2]);
            } else if (parts.length >= 2) {
                // MM.DD (현재 연도 사용)
                year = today.getFullYear();
                month = parseInt(parts[0]) - 1;
                day = parseInt(parts[1]);
            } else if (cleanDate.length === 8) {
                // YYYYMMDD
                year = parseInt(cleanDate.slice(0, 4));
                month = parseInt(cleanDate.slice(4, 6)) - 1;
                day = parseInt(cleanDate.slice(6, 8));
            } else if (cleanDate.length === 4) {
                // MMDD
                year = today.getFullYear();
                month = parseInt(cleanDate.slice(0, 2)) - 1;
                day = parseInt(cleanDate.slice(2, 4));
            } else {
                return null;
            }

            const parsedDate = new Date(year, month, day);
            parsedDate.setHours(0, 0, 0, 0);

            // 유효한 날짜인지 체크
            if (isNaN(parsedDate.getTime())) return null;

            return parsedDate;
        }

        // 마감일까지 남은 일수 계산 (D-X)
        function getDaysUntilDeadline(deadlineStr) {
            const deadlineDate = parseDeadlineDate(deadlineStr);
            if (!deadlineDate) return null;

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const diffTime = deadlineDate.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            return diffDays;
        }

        // D-0 = 오늘 마감
        function checkDeadline(deadlineStr) {
            const days = getDaysUntilDeadline(deadlineStr);
            return days === 0;
        }

        // D-1 = 내일 마감
        function checkDeadlineTomorrow(deadlineStr) {
            const days = getDaysUntilDeadline(deadlineStr);
            return days === 1;
        }

        // D-X 표시용 함수
        function formatDaysLeft(deadlineStr) {
            const days = getDaysUntilDeadline(deadlineStr);
            if (days === null) return '';
            if (days < 0) return '마감됨';
            if (days === 0) return 'D-0';
            if (days === 1) return 'D-1';
            return `D-${days}`;
        }

        window.onload = loadJobs;
    </script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="mb-8 text-center">
            <h1
                class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">
                Job Scout
            </h1>
            <p class="text-gray-500 mt-2">매일 아침 배달되는 맞춤형 채용 브리핑</p>
        </header>

        <p id="scraper-status" hidden class="mb-6 rounded bg-amber-100 p-3 text-sm text-amber-900" role="status"></p>

        <!-- 통계 카드 (클릭 가능) -->
        <div class="grid grid-cols-4 gap-4 mb-6">
            <div onclick="showOnlyNew=false; showOnlyDeadlineToday=false; showOnlyDeadlineTomorrow=false; renderJobs(allJobs); updateFilterButtons(); updateStats();"
                class="bg-white rounded-lg p-4 text-center shadow cursor-pointer hover:shadow-lg transition">
                <p class="text-2xl font-bold text-gray-800" id="stat-total">0</p>
                <p class="text-sm text-gray-500">전체 공고</p>
            </div>
            <div onclick="toggleNewFilter()"
                class="bg-white rounded-lg p-4 text-center shadow cursor-pointer hover:shadow-lg transition">
                <p class="text-2xl font-bold text-green-600" id="stat-new">0</p>
                <p class="text-sm text-gray-500">신규 공고</p>
            </div>
            <div onclick="toggleTomorrowFilter()"
                class="bg-white rounded-lg p-4 text-center shadow cursor-pointer hover:shadow-lg transition">
                <p class="text-2xl font-bold text-orange-500" id="stat-tomorrow">0</p>
                <p class="text-sm text-gray-500">🔥 내일 마감</p>
            </div>
            <div onclick="toggleDeadlineFilter()"
                class="bg-white rounded-lg p-4 text-center shadow cursor-pointer hover:shadow-lg transition">
                <p class="text-2xl font-bold text-red-600" id="stat-deadline">0</p>
                <p class="text-sm text-gray-500">🚨 오늘 마감</p>
            </div>
        </div>

        </div>

        <!-- 플랫폼 필터 버튼 -->
        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <span class="text-gray-500 text-sm mr-2 self-center">플랫폼:</span>

        <div id="job-list" class="space-y-4">

        <footer class="mt-12 text-center text-gray-400 text-sm">
